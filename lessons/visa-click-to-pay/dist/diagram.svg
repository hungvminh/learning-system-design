<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1290" viewBox="0 0 1640 1290" id="diagram">
<rect width="1640" height="1290" fill="#f6f4ef"/>
<g class="node" data-id="title">
<text x="70" y="76" font-family="Noto Sans" font-size="42" font-weight="700" fill="#16181d" text-anchor="start">How does Visa Click to Pay work?</text>
<text x="70" y="110" font-family="Noto Sans" font-size="17" font-weight="400" fill="#6a6f7a" text-anchor="start">A one-click online checkout built on the EMV® Secure Remote Commerce (SRC) standard and Visa Token Service:</text>
<text x="70" y="134" font-family="Noto Sans" font-size="17" font-weight="400" fill="#6a6f7a" text-anchor="start">the shopper never retypes a card, and the merchant never sees the real card number (PAN).</text>
</g>
<g class="node" data-id="panel1">
<rect x="70" y="196" width="1500" height="230" rx="18" ry="18" fill="#ffffff" stroke="#e2ded4" stroke-width="2"/>
<rect x="110" y="178" width="321.59999999999997" height="36" rx="18" ry="18" fill="#1434CB"/>
<text x="270.79999999999995" y="202" font-family="Noto Sans" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.1">PART 1 · ONE-TIME ENROLLMENT</text>
</g>
<g class="node" data-id="e1">
<rect x="183" y="270" width="300" height="120" rx="14" ry="14" fill="#00000010"/>
<rect x="180" y="266" width="300" height="120" rx="14" ry="14" fill="#eaf2fd" stroke="#9cc2ec" stroke-width="2"/>
<text x="330" y="300" font-family="Noto Sans" font-size="20" font-weight="700" fill="#14538f" text-anchor="middle">Cardholder</text>
<text x="330" y="330" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">Enrolls once with email,</text>
<text x="330" y="351" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">phone number and card</text>
</g>
<g class="node" data-id="e2">
<rect x="643" y="270" width="320" height="120" rx="14" ry="14" fill="#00000010"/>
<rect x="640" y="266" width="320" height="120" rx="14" ry="14" fill="#eceffd" stroke="#9fa9ea" stroke-width="2"/>
<text x="800" y="300" font-family="Noto Sans" font-size="20" font-weight="700" fill="#1434CB" text-anchor="middle">Visa Click to Pay</text>
<text x="800" y="330" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">Issuer or Visa verifies the</text>
<text x="800" y="351" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">card and creates an SRC</text>
<text x="800" y="372" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">payment profile</text>
</g>
<g class="node" data-id="e3">
<rect x="1123" y="270" width="340" height="120" rx="14" ry="14" fill="#00000010"/>
<rect x="1120" y="266" width="340" height="120" rx="14" ry="14" fill="#fff3e1" stroke="#f0c88c" stroke-width="2"/>
<text x="1290" y="300" font-family="Noto Sans" font-size="20" font-weight="700" fill="#9a5b08" text-anchor="middle">Visa Token Service</text>
<text x="1290" y="330" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">Swaps the PAN for a network</text>
<text x="1290" y="351" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">token stored in the profile —</text>
<text x="1290" y="372" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">only the last 4 stay visible</text>
</g>
<g class="node" data-id="p1">
<path class="flow" d="M480,326 L634,326" fill="none" stroke="#5b6270" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="634,326 621,332.5 621,319.5" fill="#5b6270"/>
<text x="575" y="310" font-family="Noto Sans" font-size="12.5" font-weight="600" fill="#3c424d" text-anchor="middle">Enroll card</text>
<circle cx="528" cy="326" r="15" fill="#1434CB" stroke="#ffffff" stroke-width="2.5"/>
<text x="528" y="331.5" font-family="Noto Sans" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
</g>
<g class="node" data-id="p2">
<path class="flow" d="M960,326 L1114,326" fill="none" stroke="#5b6270" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="1114,326 1101,332.5 1101,319.5" fill="#5b6270"/>
<text x="1055" y="310" font-family="Noto Sans" font-size="12.5" font-weight="600" fill="#3c424d" text-anchor="middle">Tokenize</text>
<circle cx="1008" cy="326" r="15" fill="#1434CB" stroke="#ffffff" stroke-width="2.5"/>
<text x="1008" y="331.5" font-family="Noto Sans" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
</g>
<g class="node" data-id="note1">
<text x="1460" y="404" font-family="Noto Sans" font-size="13" font-weight="400" fill="#6a6f7a" text-anchor="end">The profile is reusable at every participating merchant — no card entry, no merchant-side account.</text>
</g>
<g class="node" data-id="panel2">
<rect x="70" y="486" width="1500" height="752" rx="18" ry="18" fill="#ffffff" stroke="#e2ded4" stroke-width="2"/>
<rect x="110" y="468" width="342" height="36" rx="18" ry="18" fill="#1434CB"/>
<text x="281" y="492" font-family="Noto Sans" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.1">PART 2 · CHECKOUT IN ONE CLICK</text>
</g>
<g class="node" data-id="shopper">
<rect x="183" y="580" width="300" height="150" rx="14" ry="14" fill="#00000010"/>
<rect x="180" y="576" width="300" height="150" rx="14" ry="14" fill="#eaf2fd" stroke="#9cc2ec" stroke-width="2"/>
<text x="330" y="610" font-family="Noto Sans" font-size="20" font-weight="700" fill="#14538f" text-anchor="middle">Shopper</text>
<text x="330" y="640" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">On the merchant’s site</text>
<text x="330" y="661" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">or app, already signed</text>
<text x="330" y="682" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">in to Click to Pay</text>
</g>
<g class="node" data-id="merchant">
<rect x="643" y="580" width="320" height="150" rx="14" ry="14" fill="#00000010"/>
<rect x="640" y="576" width="320" height="150" rx="14" ry="14" fill="#eaf7ee" stroke="#9dd6b2" stroke-width="2"/>
<text x="800" y="610" font-family="Noto Sans" font-size="20" font-weight="700" fill="#1b6b3c" text-anchor="middle">Merchant checkout</text>
<text x="800" y="640" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">Click to Pay button,</text>
<text x="800" y="661" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">the SRC Initiator /</text>
<text x="800" y="682" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">Visa Digital Terminal</text>
</g>
<g class="node" data-id="visa">
<rect x="1123" y="580" width="340" height="150" rx="14" ry="14" fill="#00000010"/>
<rect x="1120" y="576" width="340" height="150" rx="14" ry="14" fill="#eceffd" stroke="#9fa9ea" stroke-width="2"/>
<text x="1290" y="610" font-family="Noto Sans" font-size="20" font-weight="700" fill="#1434CB" text-anchor="middle">Visa Click to Pay</text>
<text x="1290" y="640" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">SRC System: device</text>
<text x="1290" y="661" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">fingerprint, risk decision,</text>
<text x="1290" y="682" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">shopper recognition</text>
</g>
<g class="node" data-id="a1">
<path class="flow" d="M480,651 L634,651" fill="none" stroke="#5b6270" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="634,651 621,657.5 621,644.5" fill="#5b6270"/>
<text x="557" y="608" font-family="Noto Sans" font-size="12" font-weight="600" fill="#3c424d" text-anchor="middle">Taps the Click</text>
<text x="557" y="625" font-family="Noto Sans" font-size="12" font-weight="600" fill="#3c424d" text-anchor="middle">to Pay button</text>
<circle cx="528" cy="651" r="15" fill="#1434CB" stroke="#ffffff" stroke-width="2.5"/>
<text x="528" y="656.5" font-family="Noto Sans" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
</g>
<g class="node" data-id="a2">
<path class="flow" d="M960,636 L1114,636" fill="none" stroke="#5b6270" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="1114,636 1101,642.5 1101,629.5" fill="#5b6270"/>
<text x="1055" y="600" font-family="Noto Sans" font-size="12" font-weight="600" fill="#3c424d" text-anchor="middle">Digital Terminal</text>
<text x="1055" y="617" font-family="Noto Sans" font-size="12" font-weight="600" fill="#3c424d" text-anchor="middle">initializes SRC</text>
<circle cx="1008" cy="636" r="15" fill="#1434CB" stroke="#ffffff" stroke-width="2.5"/>
<text x="1008" y="641.5" font-family="Noto Sans" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
</g>
<g class="node" data-id="a4">
<path class="flow" d="M1114,696 L966,696" fill="none" stroke="#5b6270" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="966,696 979,689.5 979,702.5" fill="#5b6270"/>
<text x="1037" y="716" font-family="Noto Sans" font-size="12" font-weight="600" fill="#3c424d" text-anchor="middle">Network token +</text>
<text x="1037" y="733" font-family="Noto Sans" font-size="12" font-weight="600" fill="#3c424d" text-anchor="middle">one-time cryptogram</text>
<text x="1037" y="750" font-family="Noto Sans" font-size="12" font-weight="600" fill="#3c424d" text-anchor="middle">(no PAN)</text>
<circle cx="1066" cy="696" r="15" fill="#1434CB" stroke="#ffffff" stroke-width="2.5"/>
<text x="1066" y="701.5" font-family="Noto Sans" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
</g>
<g class="node" data-id="a3">
<path class="flow" d="M300,576 L300,534 L1290,534 L1290,576" fill="none" stroke="#8a63d2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<polygon points="1290,576 1283.5,563 1296.5,563" fill="#8a63d2"/>
<polygon points="300,576 293.5,563 306.5,563" fill="#8a63d2"/>
<text x="400" y="522" font-family="Noto Sans" font-size="13" font-weight="600" fill="#3c424d" text-anchor="start">Recognized by device, or verifies with a passkey / e-mail or SMS one-time code, then picks a masked card — all inside Visa’s secure iframe</text>
<circle cx="360" cy="534" r="15" fill="#8a63d2" stroke="#ffffff" stroke-width="2.5"/>
<text x="360" y="539.5" font-family="Noto Sans" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
</g>
<g class="node" data-id="psp">
<rect x="183" y="980" width="300" height="130" rx="14" ry="14" fill="#00000010"/>
<rect x="180" y="976" width="300" height="130" rx="14" ry="14" fill="#f4edfc" stroke="#c7b2e8" stroke-width="2"/>
<text x="330" y="1010" font-family="Noto Sans" font-size="20" font-weight="700" fill="#5b3a9b" text-anchor="middle">PSP / Acquirer</text>
<text x="330" y="1040" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">Gets the token and</text>
<text x="330" y="1061" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">cryptogram instead of</text>
<text x="330" y="1082" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">the card number</text>
</g>
<g class="node" data-id="visanet">
<rect x="643" y="980" width="320" height="130" rx="14" ry="14" fill="#00000010"/>
<rect x="640" y="976" width="320" height="130" rx="14" ry="14" fill="#eceffd" stroke="#9fa9ea" stroke-width="2"/>
<text x="800" y="1010" font-family="Noto Sans" font-size="20" font-weight="700" fill="#1434CB" text-anchor="middle">VisaNet</text>
<text x="800" y="1040" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">Validates the cryptogram</text>
<text x="800" y="1061" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">and the Token Service</text>
<text x="800" y="1082" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">detokenizes to the PAN</text>
</g>
<g class="node" data-id="issuer">
<rect x="1123" y="980" width="340" height="130" rx="14" ry="14" fill="#00000010"/>
<rect x="1120" y="976" width="340" height="130" rx="14" ry="14" fill="#fdecee" stroke="#f0aab1" stroke-width="2"/>
<text x="1290" y="1010" font-family="Noto Sans" font-size="20" font-weight="700" fill="#a32330" text-anchor="middle">Issuer / Bank</text>
<text x="1290" y="1040" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">Sees its own PAN and</text>
<text x="1290" y="1061" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">approves or declines the</text>
<text x="1290" y="1082" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="middle">authorization</text>
</g>
<g class="node" data-id="a5">
<path class="flow" d="M720,726 L720,836 L250,836 L250,970" fill="none" stroke="#5b6270" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="250,970 243.5,957 256.5,957" fill="#5b6270"/>
<text x="500" y="824" font-family="Noto Sans" font-size="12.5" font-weight="600" fill="#3c424d" text-anchor="middle">Authorization request with token + cryptogram</text>
<circle cx="720" cy="762" r="15" fill="#1434CB" stroke="#ffffff" stroke-width="2.5"/>
<text x="720" y="767.5" font-family="Noto Sans" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
</g>
<g class="node" data-id="a6">
<path class="flow" d="M480,1041 L634,1041" fill="none" stroke="#5b6270" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="634,1041 621,1047.5 621,1034.5" fill="#5b6270"/>
<text x="575" y="1004" font-family="Noto Sans" font-size="12" font-weight="600" fill="#3c424d" text-anchor="middle">Routed over</text>
<text x="575" y="1021" font-family="Noto Sans" font-size="12" font-weight="600" fill="#3c424d" text-anchor="middle">VisaNet</text>
<circle cx="528" cy="1041" r="15" fill="#1434CB" stroke="#ffffff" stroke-width="2.5"/>
<text x="528" y="1046.5" font-family="Noto Sans" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
</g>
<g class="node" data-id="a7">
<path class="flow" d="M960,1041 L1114,1041" fill="none" stroke="#5b6270" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="1114,1041 1101,1047.5 1101,1034.5" fill="#5b6270"/>
<text x="1037" y="1004" font-family="Noto Sans" font-size="12" font-weight="600" fill="#3c424d" text-anchor="middle">Real PAN and</text>
<text x="1037" y="1021" font-family="Noto Sans" font-size="12" font-weight="600" fill="#3c424d" text-anchor="middle">3-D Secure data</text>
<circle cx="1008" cy="1041" r="15" fill="#1434CB" stroke="#ffffff" stroke-width="2.5"/>
<text x="1008" y="1046.5" font-family="Noto Sans" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
</g>
<g class="node" data-id="a8">
<path class="flow" d="M1290,1106 L1290,1166 L330,1166 L330,1112" fill="none" stroke="#5b6270" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="330,1112 336.5,1125 323.5,1125" fill="#5b6270"/>
<text x="790" y="1158" font-family="Noto Sans" font-size="12.5" font-weight="600" fill="#3c424d" text-anchor="middle">Approve / decline response travels back the same path</text>
<circle cx="1230" cy="1166" r="15" fill="#1434CB" stroke="#ffffff" stroke-width="2.5"/>
<text x="1230" y="1171.5" font-family="Noto Sans" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
</g>
<g class="node" data-id="a9">
<path class="flow" d="M420,970 L420,896 L840,896 L840,732" fill="none" stroke="#5b6270" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="840,732 846.5,745 833.5,745" fill="#5b6270"/>
<text x="640" y="884" font-family="Noto Sans" font-size="12.5" font-weight="600" fill="#3c424d" text-anchor="middle">Approved — order confirmed to the shopper</text>
<circle cx="420" cy="936" r="15" fill="#1434CB" stroke="#ffffff" stroke-width="2.5"/>
<text x="420" y="941.5" font-family="Noto Sans" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">9</text>
</g>
<g class="node" data-id="callout">
<rect x="1050" y="800" width="412" height="146" rx="14" ry="14" fill="#f8f7ff" stroke="#b9bdf0" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1256" y="831" font-family="Noto Sans" font-size="16" font-weight="700" fill="#1434CB" text-anchor="middle">Why this is safer than a card form</text>
<text x="1072" y="858" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="start">•  The merchant stores a token, never the PAN</text>
<text x="1072" y="879" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="start">•  The token is scoped to that merchant only</text>
<text x="1072" y="900" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="start">•  The cryptogram is valid for one payment</text>
<text x="1072" y="921" font-family="Noto Sans" font-size="13.5" font-weight="400" fill="#454b55" text-anchor="start">•  Issuer gets strong auth signals — fewer declines</text>
</g>
<g class="node" data-id="footer">
<text x="70" y="1264" font-family="Noto Sans" font-size="14" font-weight="400" fill="#6a6f7a" text-anchor="start">Key idea: the card number is replaced by a merchant-scoped network token plus a cryptogram that is valid for one transaction only — so stolen checkout data cannot be replayed elsewhere.</text>
</g>
</svg>
